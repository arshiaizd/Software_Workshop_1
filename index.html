<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Task Planner</title>
</head>
<body>
    <header>
        <h1>Study Task Planner</h1>
    </header>

    <main>
        <section aria-labelledby="create-task-heading">
            <h2 id="create-task-heading">Create a task</h2>
            <form id="task-form" novalidate>
                <div>
                    <label for="task-title">Task title</label>
                    <input id="task-title" name="title" type="text" maxlength="100" required>
                </div>

                <div>
                    <label for="task-deadline">Deadline</label>
                    <input id="task-deadline" name="deadline" type="date">
                </div>

                <button type="submit">Add task</button>
                <p id="form-error" role="alert" aria-live="polite"></p>
            </form>
        </section>

        <section aria-labelledby="tasks-heading">
            <h2 id="tasks-heading">Tasks</h2>

            <div aria-label="Task view controls">
                <label for="task-search">Search tasks</label>
                <input id="task-search" type="search" placeholder="Search by title">

                <label for="status-filter">Status</label>
                <select id="status-filter">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>

                <label for="deadline-sort">Deadline order</label>
                <select id="deadline-sort">
                    <option value="none">Unsorted</option>
                    <option value="deadline">Earliest deadline first</option>
                </select>
            </div>

            <p id="empty-state" hidden>No tasks match the current view.</p>
            <ul id="task-list" aria-live="polite"></ul>
        </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/task-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
