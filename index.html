<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Organize study tasks and deadlines in one focused workspace.">
    <title>Study Task Planner</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header__content">
            <p class="site-header__eyebrow">Student workspace</p>
            <h1>Study Task Planner</h1>
            <p class="site-header__subtitle">Plan assignments, track deadlines, and keep study sessions organized.</p>
        </div>
    </header>

    <main class="app-layout">
        <section class="panel task-entry" aria-labelledby="task-entry-heading">
            <header class="section-heading">
                <h2 id="task-entry-heading">Add a study task</h2>
                <p>Capture what needs to be done and when it is due.</p>
            </header>
        </section>

        <section class="panel task-overview" aria-labelledby="task-overview-heading">
            <header class="section-heading">
                <h2 id="task-overview-heading">Your tasks</h2>
                <p>Review and manage your current study workload.</p>
            </header>
        </section>
    </main>

    <footer class="site-footer">
        <p>Study Task Planner</p>
    </footer>
</body>
</html>
